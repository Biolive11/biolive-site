<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BIOLIVE MLM – Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  color:#333;
}
header{
  background:#0b4da2;
  color:#fff;
  padding:18px;
  text-align:center;
}
.container{
  padding:15px;
}
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.stats{
  display:flex;
  gap:10px;
}
.stat{
  flex:1;
  background:#eef3ff;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
.stat h2{margin:5px 0;color:#0b4da2}
.tree{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.node{
  background:#0b4da2;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  margin:5px;
  animation:pop .4s ease;
}
.children{
  display:flex;
  gap:40px;
  margin-top:10px;
}
button{
  background:#0b4da2;
  color:#fff;
  border:none;
  padding:12px 16px;
  border-radius:8px;
  margin:5px;
  font-size:15px;
}
button:active{transform:scale(.97)}
.income{
  display:flex;
  gap:10px;
}
.income div{
  flex:1;
  background:#eef3ff;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}
footer{
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>BIOLIVE MLM – Dashboard</h1>
  <p id="welcome"></p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card">
  <h3>User Login (Demo)</h3>
  <input id="usernameInput" placeholder="Enter your name"
   style="padding:10px;width:70%">
  <button onclick="saveUser()">Login</button>
</div>

<!-- SUMMARY -->
<div class="card">
  <h3>Binary Summary</h3>
  <div class="stats">
    <div class="stat">Left<br><h2 id="left">0</h2></div>
    <div class="stat">Right<br><h2 id="right">0</h2></div>
    <div class="stat">Pairs<br><h2 id="pairs">0</h2></div>
  </div>
</div>

<!-- TREE -->
<div class="card">
  <h3>Binary Tree (Auto Demo)</h3>
  <div class="tree">
    <div class="node">YOU</div>
    <div class="children">
      <div class="node" id="L">L</div>
      <div class="node" id="R">R</div>
    </div>
  </div>

  <button onclick="startDemo()">Start Auto Demo</button>
  <button onclick="presentation()">Presentation Mode</button>
</div>

<!-- INCOME -->
<div class="card">
  <h3>Level Income (Demo)</h3>
  <div class="income">
    <div>Level-1<br><h2 id="lvl1">0</h2></div>
    <div>Level-2<br><h2 id="lvl2">0</h2></div>
  </div>
</div>

</div>

<footer>
© 2026 BIOLIVE MLM – Demo System
</footer>

<script>
let left=0,right=0,lvl1=0,lvl2=0;

function saveUser(){
  let u=document.getElementById("usernameInput").value;
  if(u){
    localStorage.setItem("user",u);
    loadUser();
  }
}
function loadUser(){
  let u=localStorage.getItem("user")||"Demo User";
  document.getElementById("welcome").innerText="Welcome, "+u;
}
loadUser();

function startDemo(){
  let interval=setInterval(()=>{
    if(Math.random()>0.5){left++;lvl1+=50;}
    else{right++;lvl1+=50;}

    let pairs=Math.min(left,right);
    lvl2=pairs*100;

    document.getElementById("left").innerText=left;
    document.getElementById("right").innerText=right;
    document.getElementById("pairs").innerText=pairs;
    document.getElementById("lvl1").innerText=lvl1;
    document.getElementById("lvl2").innerText=lvl2;

    if(left+right>=10) clearInterval(interval);
  },1000);
}

function presentation(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
}
</script>

</body>
</html>
